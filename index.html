<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberZone_95 Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="czicon.png">
<style>
body{
background:#000;
color:#0f0;
font-family:Courier New;
margin:0;
padding:15px;
}

.chat-window{
max-width:900px;
margin:auto;
background:#c0c0c0;
border:3px outset #888;
}

.title-bar{
background:linear-gradient(90deg,#000080,#0080ff);
color:#fff;
padding:6px;
font-weight:bold;
}

.workspace{display:flex;gap:10px;padding:10px;}

.chat-log{
flex:3;
height:340px;
background:#000;
border:3px inset #888;
overflow-y:auto;
padding:8px;
}

.user-list{
flex:1;
background:#000;
border:3px inset #888;
color:#0ff;
padding:8px;
font-size:13px;
}

.input-bar{
display:flex;
gap:5px;
padding:10px;
background:#c0c0c0;
}

.input-bar input{
flex:1;
padding:6px;
}

.sys{color:yellow;}

.replyBox{
background:#111;
border-left:4px solid yellow;
color:yellow;
padding:4px;
font-size:11px;
margin-bottom:4px;
}

.replyHighlight{
background:#333300;
border-left:4px solid yellow;
padding:3px;
}

.msgBtn{
font-size:11px;
margin-left:6px;
cursor:pointer;
}


@keyframes blink {
    50% { opacity: 0.4; }
}

.sys-sans{
    color:#00ffff;
    font-family:"Comic Sans MS", cursive;
    text-shadow: 0 0 6px #00ffff;
    animation: blink 1s infinite;
}


</style>

<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>

</head>

<body>

<div class="chat-window">
<div class="title-bar">CyberZone_95 Chat</div>

<div class="workspace">
<div class="chat-log" id="chatLog"></div>

<div class="user-list">
<div style="color:yellow;">ONLINE USERS</div>
<div id="userListBox"></div>
</div>
</div>

<div id="typingIndicator" style="
padding:4px 10px;
font-size:12px;
color:#000;
height:16px;
"></div>

<div class="input-bar">
<input id="chatInput" placeholder="Type message...">
<button id="sendBtn">Send</button>
<button id="imgBtn">Image</button>
<button id="clearBtn">Clear</button>
<input type="file" id="imgUpload" hidden>
</div>

<!-- FIX: audio element must be in DOM BEFORE JS uses it -->
<audio id="bgMusic"></audio>
<audio id="messageSound" src="aim-message.mp3" preload="auto"></audio>
<audio id="replySound" src="aim-notif.mp3" preload="auto"></audio>
</div>

<script>

// ================= SAFETY CHECK =================
if (!window.mqtt) {
alert("MQTT failed to load.");
throw new Error("mqtt not loaded");
}

// ================= USER =================
const userId = crypto.randomUUID();
let currentAlias = "Guest_" + Math.floor(Math.random()*9000);

// ================= UI =================
const chatLog=document.getElementById("chatLog");
const chatInput=document.getElementById("chatInput");
const sendBtn=document.getElementById("sendBtn");
const clearBtn=document.getElementById("clearBtn");
const imgBtn=document.getElementById("imgBtn");
const imgUpload=document.getElementById("imgUpload");
const userListBox=document.getElementById("userListBox");
const bgMusic = document.getElementById("bgMusic");
const messageSound = document.getElementById("messageSound");
const replySound = document.getElementById("replySound");
// ================= MQTT =================
const topic="luke_retro_global_open_lobby";
const client=mqtt.connect("wss://broker.emqx.io:8084/mqtt");

// ================= STATE =================
const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dbrruuftv/image/upload";
const CLOUDINARY_UPLOAD_PRESET = "chat_upload";
const users={};
let replyTarget=null;
const typingUsers = {};
let typingTimeout;

// ================= BACKGROUND MUSIC =================
const playlist = [
    "sunday_theme.mp3",
    "friday_theme.mp3",
    "star_u.mp3",
    "relaxing_scene.mp3",
    "devils_never_cry.mp3",
    "bury_the_light.mp3",
    "sans.mp3",
    "bonetrousle.mp3"
];

let musicEnabled = true;
let shuffleBag = [];
let currentTrack = null;
const secretThemes = {
    dante: {
        song: "devils_never_cry.mp3",
        message: "NOW PLAYING ♫♪ DEVILS_NEVER_CRY.MP3"
    },
    vergil: {
        song: "bury_the_light.mp3",
        message: "NOW PLAYING ♫♪ BURY_THE_LIGHT.MP3"
    },
    sans: {
        song: "sans.mp3",
        message: "hehe sup kiddo check out my theme"
    },
    papyrus: {
        song: "bonetrousle.mp3",
        message: "NYEHEHE! SO YOU HAVE PICKED THE BEST NAME, HUMAN!!!"
    }
};
bgMusic.volume = 0.04;

// Fisher–Yates shuffle
function shuffle(array) {
    const arr = array.slice();
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function refillBag() {
    shuffleBag = shuffle(playlist);
}

function playNextTrack() {
    if (!musicEnabled || !bgMusic) return;

    if (shuffleBag.length === 0) {
        refillBag();
    }

    currentTrack = shuffleBag.shift();
    bgMusic.src = currentTrack;

    // show in chat
    sys("now playing ♫♪ " + currentTrack);

    bgMusic.play().catch(() => {});
}

bgMusic.onended = () => {
    playNextTrack();
};
// ================= SYSTEM =================
function sys(t, type = "normal"){
    const d = document.createElement("div");

    if(type === "sans"){
        d.className = "sys-sans";
    } else {
        d.className = "sys";
    }

    d.textContent = "*** " + t;
    chatLog.appendChild(d);
}

// ================= USERS =================
function renderUsers(){
userListBox.innerHTML="";
const now=Date.now();

Object.values(users).forEach(u=>{
if(now-u.lastSeen<60000){
const d=document.createElement("div");
d.textContent="• "+u.name;
userListBox.appendChild(d);
}
});
}

// ================= TYPING =================
function renderTyping(){
const box=document.getElementById("typingIndicator");

const names=Object.values(typingUsers)
.filter(u=>Date.now()-u.time<3000)
.map(u=>u.name);

if(names.length===0){
box.textContent="";
return;
}

if(names.length===1){
box.textContent=names[0]+" is typing...";
return;
}

if(names.length===2){
box.textContent=names[0]+" and "+names[1]+" are typing...";
return;
}

box.textContent="Several users are typing...";
}

// ================= CONNECT =================
client.on("connect",()=>{
client.subscribe(topic);

client.publish(topic,JSON.stringify({
type:"join",
id:userId,
name:currentAlias
}));
});

// ================= MESSAGE =================
client.on("message",(t,p)=>{
let d;

try{
    d = JSON.parse(p.toString());
}catch(err){
    console.error("Invalid message", err);
    return;
}

if(d.type==="typing"){
if(d.id!==userId){
typingUsers[d.id]={name:d.sender,time:Date.now()};
renderTyping();
}
return;
}

if(d.type==="stopTyping"){
delete typingUsers[d.id];
renderTyping();
return;
}

if(d.type==="join"){
users[d.id]={name:d.name,lastSeen:Date.now()};
renderUsers();
sys(d.name+" joined");
return;
}

if(!d.text) return;

const isReplyToMe =
    d.reply &&
    d.reply.senderId === userId;

if (d.id !== userId) {

    if (isReplyToMe) {
        replySound.currentTime = 0;
        replySound.play().catch(() => {});
    } else {
        messageSound.currentTime = 0;
        messageSound.play().catch(() => {});
    }

}
delete typingUsers[d.id];
renderTyping();

if(d.id){
    users[d.id]={
        name:d.sender,
        lastSeen:Date.now()
    };
}

renderUsers();

const row=document.createElement("div");

if(d.reply && d.reply.senderId === userId){
    row.classList.add("replyHighlight");
}
if(d.reply){
const r=document.createElement("div");
r.className="replyBox";
r.textContent=`↳ ${d.reply.user}: ${d.reply.text}`;
row.appendChild(r);
}

const header=document.createElement("span");
header.style.color = d.sender===currentAlias ? "#0ff" : "#f0f";
header.textContent = `<${d.sender}> `;

const time=document.createElement("span");
time.style.color="#0f0";
time.textContent=` [${d.timestamp}] `;

const content=document.createElement("span");

if(d.mediaType === "image"){
const img=document.createElement("img");
img.src=d.text;
img.style.maxWidth="200px";
img.style.border="2px solid #0f0";
content.appendChild(img);
} else {
content.textContent=" "+d.text;
}

const btn=document.createElement("button");
btn.className="msgBtn";
btn.textContent="Reply";

btn.onclick=()=>{
replyTarget={
id:d.msgId,
senderId:d.id,
user:d.sender,
text:d.text
};
sys("replying to "+d.sender);
};

row.appendChild(header);
row.appendChild(time);
row.appendChild(content);
row.appendChild(btn);

chatLog.appendChild(row);
chatLog.scrollTo({
    top: chatLog.scrollHeight,
    behavior: "smooth"
});
});

// ================= SEND =================
function send(){

client.publish(topic,JSON.stringify({
type:"stopTyping",
id:userId,
sender:currentAlias
}));

let text=chatInput.value.trim();
if(!text) return;

if(text==="/clear"){
chatLog.innerHTML="";
sys("chat cleared");
chatInput.value="";
return;
}

if(text.startsWith("/nick ")){
const newNick = text.slice(6).trim();

if(!newNick){
    sys("nickname cannot be empty");
    return;
}

currentAlias = newNick;
