<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>

<script>
/* =========================================================
   SAFETY CHECK
========================================================= */

if (!window.mqtt) {
    alert("MQTT failed to load.");
    throw new Error("MQTT library unavailable.");
}


/* =========================================================
   USER
========================================================= */

const userId = crypto.randomUUID();

let currentAlias =
    "Guest_" + Math.floor(Math.random() * 9000);

/* =========================================================
   UI
========================================================= */

const chatLog =
    document.getElementById("chatLog");

const chatInput =
    document.getElementById("chatInput");

const sendBtn =
    document.getElementById("sendBtn");

const clearBtn =
    document.getElementById("clearBtn");

const imgBtn =
    document.getElementById("imgBtn");

const imgUpload =
    document.getElementById("imgUpload");

const userListBox =
    document.getElementById("userListBox");

const typingIndicator =
    document.getElementById("typingIndicator");

const profileName =
    document.getElementById("profileName");

const connectionStatus =
    document.getElementById("connectionStatus");

const bgMusic =
    document.getElementById("bgMusic");

const messageSound =
    document.getElementById("messageSound");

const replySound =
    document.getElementById("replySound");

const musicBtn =
    document.getElementById("musicBtn");

const nickBtn =
    document.getElementById("nickBtn");


profileName.textContent =
    currentAlias;


/* =========================================================
   TIME
========================================================= */

function getChatTime() {

    return new Date().toLocaleTimeString(
        "en-GB",
        {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    );
}


/* =========================================================
   MQTT
========================================================= */

const topic =
    "luke_retro_global_open_lobby";

const client =
    mqtt.connect(
        "wss://broker.emqx.io:8084/mqtt"
    );


/* =========================================================
   CLOUDINARY
========================================================= */

const CLOUDINARY_URL =
    "https://api.cloudinary.com/v1_1/dbrruuftv/image/upload";

const CLOUDINARY_UPLOAD_PRESET =
    "chat_upload";


/* =========================================================
   STATE
========================================================= */

const users = {};
const typingUsers = {};

let replyTarget = null;

let unreadCount = 0;

let flashInterval = null;
let flashState = false;

let musicEnabled = true;
let musicStarted = false;

let shuffleBag = [];
let currentTrack = null;

let specialMusicLock = false;
let activeSpecialProfile = null;

let typingTimer = null;
let lastTypingSent = 0;


/* =========================================================
   TITLE
========================================================= */

const ORIGINAL_TITLE =
    "AIM - luke's chatroom";


function updateTitle() {

    if (unreadCount <= 0) {

        document.title =
            ORIGINAL_TITLE;

        if (flashInterval) {

            clearInterval(
                flashInterval
            );

            flashInterval = null;
        }

        return;
    }


    const label =
        unreadCount === 1
            ? "New Message!"
            : "New Messages!";


    const unreadTitle =
        `(${unreadCount}) ${label} - ${ORIGINAL_TITLE}`;


    if (!document.hidden) {

        document.title =
            unreadTitle;

        return;
    }


    if (!flashInterval) {

        flashInterval =
            setInterval(() => {

                flashState =
                    !flashState;

                document.title =
                    flashState
                        ? unreadTitle
                        : ORIGINAL_TITLE;

            }, 600);
    }
}


document.addEventListener(
    "visibilitychange",
    () => {

        if (!document.hidden) {

            unreadCount = 0;
            flashState = false;

            if (flashInterval) {

                clearInterval(
                    flashInterval
                );

                flashInterval = null;
            }

            document.title =
                ORIGINAL_TITLE;
        }
    }
);


/* =========================================================
   SYSTEM MESSAGE
========================================================= */

function sys(text) {

    const div =
        document.createElement("div");

    div.className =
        "system-message";

    const strong =
        document.createElement("strong");

    strong.textContent =
        "[AIM]";

    div.appendChild(
        strong
    );

    div.appendChild(
        document.createTextNode(
            " " + text
        )
    );

    chatLog.appendChild(
        div
    );

    chatLog.scrollTop =
        chatLog.scrollHeight;
}


/* =========================================================
   SPECIAL PROFILES
========================================================= */

const specialProfiles = [

    {
        match: "dante",
        music: "devils_never_cry.mp3",
        message: "'Jackpot.'"
    },

    {
        match: "vergil",
        music: "bury_the_light.mp3",
        message: "'Where's your motivation?'"
    },

    {
        match: "sans",
        music: "sans.mp3",
        message: "hehe sup kiddo"
    },

    {
        match: "papyrus",
        music: "bonetrousle.mp3",
        message:
            "NYEHEHE! SO YOU HAVE PICKED THE BEST NAME!!!"
    },

    {
        match: "cell",
        music: "perfect_cell_theme.mp3",
        message:
            "'You're either perfect... or you're not me.'"
    },

    {
        match: "piccolo",
        music: "piccolo_aura.mp3",
        message:
            "alright we see the fit bro"
    }

];


function applySpecialProfile(name) {

    const profile =
        specialProfiles.find(
            p =>
                name
                    .toLowerCase()
                    .includes(
                        p.match.toLowerCase()
                    )
        );


    if (!profile) {

        activeSpecialProfile = null;
        specialMusicLock = false;

        bgMusic.pause();
        bgMusic.currentTime = 0;

        if (musicEnabled) {
            playNextTrack();
        }

        return;
    }


    if (
        activeSpecialProfile ===
        profile.match
    ) {
        return;
    }


    activeSpecialProfile =
        profile.match;


    sys(
        profile.message
    );


    if (profile.music) {

        bgMusic.pause();

        specialMusicLock =
            true;

        currentTrack =
            profile.music;

        bgMusic.src =
            currentTrack;

        bgMusic.currentTime =
            0;

        if (musicEnabled) {

            bgMusic.play()
                .catch(() => {

                    /*
                     Browser autoplay
                     restrictions are normal.
                    */

                });
        }
    }
}


/* =========================================================
   MUSIC
========================================================= */

const playlist = [

    "sunday_theme.mp3",
    "friday_theme.mp3",
    "star_u.mp3",
    "relaxed_scene.mp3"

];


bgMusic.volume =
    0.04;


function shuffle(array) {

    const result =
        array.slice();


    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }


    return result;
}


function refillBag() {

    shuffleBag =
        shuffle(
            playlist
        );
}


function playNextTrack() {

    if (
        !musicEnabled ||
        specialMusicLock
    ) {
        return;
    }


    if (
        shuffleBag.length === 0
    ) {

        refillBag();
    }


    currentTrack =
        shuffleBag.shift();


    bgMusic.src =
        currentTrack;


    sys(
        "Now playing ♫ " +
        currentTrack
    );


    musicStarted =
        true;


    bgMusic.play()
        .catch(() => {});
}


bgMusic.onended =
    () => {

        if (
            specialMusicLock
        ) {

            specialMusicLock =
                false;

            playNextTrack();

            return;
        }


        playNextTrack();
    };


bgMusic.onerror =
    () => {

        sys(
            "ERROR loading: " +
            currentTrack
        );

        console.error(
            "Failed to load:",
            currentTrack
        );

    };


musicBtn.onclick =
    () => {

        musicEnabled =
            !musicEnabled;


        if (!musicEnabled) {

            bgMusic.pause();

            musicBtn.textContent =
                "Music: Off";

            sys(
                "music muted"
            );

            return;
        }


        musicBtn.textContent =
            "Music: On";


        if (
            bgMusic.src &&
            !specialMusicLock
        ) {

            bgMusic.play()
                .catch(() => {});

        } else if (
            !bgMusic.src
        ) {

            playNextTrack();

        } else {

            bgMusic.play()
                .catch(() => {});
        }
    };


/* =========================================================
   USERS
========================================================= */

function renderUsers() {

    userListBox.innerHTML =
        "";

    const now =
        Date.now();


    Object.values(users)
        .sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name
                )
        )
        .forEach(user => {

            if (
                now - user.lastSeen <
                60000
            ) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "user";


                const dot =
                    document.createElement(
                        "span"
                    );

                dot.className =
                    "user-dot";


                div.appendChild(
                    dot
                );


                div.appendChild(
                    document.createTextNode(
                        user.name
                    )
                );


                div.onclick =
                    () => {

                        chatInput.value +=
                            " @" +
                            user.name;

                        chatInput.focus();
                    };


                userListBox.appendChild(
                    div
                );
            }

        });
}


setInterval(
    renderUsers,
    10000
);


/* =========================================================
   TYPING
========================================================= */

function renderTyping() {

    const names =
        Object.values(
            typingUsers
        )
        .filter(
            user =>
                Date.now() -
                user.time <
                3000
        )
        .map(
            user =>
                user.name
        );


    if (
        names.length === 0
    ) {

        typingIndicator.textContent =
            "";

        return;
    }


    if (
        names.length === 1
    ) {

        typingIndicator.textContent =
            names[0] +
            " is typing...";

        return;
    }


    if (
        names.length === 2
    ) {

        typingIndicator.textContent =
            names[0] +
            " and " +
            names[1] +
            " are typing...";

        return;
    }


    typingIndicator.textContent =
        "Several users are typing...";
}


setInterval(
    renderTyping,
    500
);


/* =========================================================
   SEND JOIN / PRESENCE
========================================================= */

function publishJoin() {

    if (!client.connected) {
        return;
    }


    client.publish(
        topic,
        JSON.stringify({

            type:
                "join",

            id:
                userId,

            name:
                currentAlias

        })
    );
}

function publishPresence() {

    if (!client.connected) {
        return;
    }

    client.publish(
        topic,
        JSON.stringify({
            type: "presence",
            id: userId,
            name: currentAlias
        })
    );
}

setInterval(() => {

    publishPresence();

}, 20000);
/* =========================================================
   MQTT CONNECT
========================================================= */

client.on(
    "connect",
    () => {

        connectionStatus.textContent =
            "Connected";


        sys(
            "Connected to luke's chatroom."
        );


        client.subscribe(
            topic,
            err => {

                if (err) {

                    console.error(
                        "Subscribe error",
                        err
                    );

                    connectionStatus.textContent =
                        "Connection Error";

                    return;
                }


                publishJoin();

                publishPresence();

                applySpecialProfile(
                   currentAlias
);
            }
        );
    }
);


client.on(
    "offline",
    () => {

        connectionStatus.textContent =
            "Offline";
    }
);


client.on(
    "reconnect",
    () => {

        connectionStatus.textContent =
            "Reconnecting...";
    }
);


client.on(
    "error",
    error => {

        console.error(
            "MQTT error:",
            error
        );

        connectionStatus.textContent =
            "Connection Error";
    }
);


/* =========================================================
   INCOMING MQTT
========================================================= */

client.on(
    "message",
    (topicName, packet) => {

        let d;


        try {

            d =
                JSON.parse(
                    packet.toString()
                );

        } catch {

            return;
        }


                 /* -----------------------------------------
            JOIN
         ----------------------------------------- */
         
         if (
             d.type ===
             "join"
         ) {
         
             users[d.id] = {
         
                 name:
                     d.name,
         
                 lastSeen:
                     Date.now()
             };
         
         
             renderUsers();
         
         
             if (
                 d.id !== userId
             ) {
         
                 sys(
                     d.name +
                     " signed on."
                 );
             }
         
         
             return;
         }
         
         
         /* -----------------------------------------
            PRESENCE
         ----------------------------------------- */
         
         if (
             d.type ===
             "presence"
         ) {
         
             users[d.id] = {
         
                 name:
                     d.name,
         
                 lastSeen:
                     Date.now()
             };
         
             renderUsers();
         
             return;
         }
         
         
         /* -----------------------------------------
            NAME CHANGE
         ----------------------------------------- */
         
         if (
             d.type ===
             "nameChange"
         ) {

            users[d.id] = {

                name:
                    d.name,

                lastSeen:
                    Date.now()
            };


            renderUsers();


            if (
                d.id !== userId
            ) {

                sys(
                    d.name +
                    " signed on."
                );
            }


            return;
        }


        /* -----------------------------------------
           NAME CHANGE
        ----------------------------------------- */

        if (
            d.type ===
            "nameChange"
        ) {

            users[d.id] = {

                name:
                    d.name,

                lastSeen:
                    Date.now()
            };


            renderUsers();


            if (
                d.id === userId
            ) {

                profileName.textContent =
                    d.name;

                applySpecialProfile(
                    d.name
                );

                return;
            }


            sys(
                `${d.oldName} is now ${d.name}`
            );


            return;
        }


        /* -----------------------------------------
           TYPING
        ----------------------------------------- */

        if (
            d.type ===
            "typing"
        ) {

            if (
                d.id !== userId
            ) {

                typingUsers[d.id] = {

                    name:
                        d.sender,

                    time:
                        Date.now()
                };


                renderTyping();
            }


            return;
        }


        /* -----------------------------------------
           STOP TYPING
        ----------------------------------------- */

        if (
            d.type ===
            "stopTyping"
        ) {

            delete typingUsers[
                d.id
            ];

            renderTyping();

            return;
        }


        /* -----------------------------------------
           MESSAGE
        ----------------------------------------- */

        if (
            d.type !==
            "message"
        ) {
            return;
        }


        if (!d.text) {
            return;
        }


        const mentionMe =
            d.text
                .toLowerCase()
                .includes(
                    "@" +
                    currentAlias
                        .toLowerCase()
                );


        /* -----------------------------------------
           NOTIFICATIONS
        ----------------------------------------- */

        if (
            d.id !== userId
        ) {

            if (
                document.hidden
            ) {

                unreadCount++;

                updateTitle();
            }


            if (
                (
                    d.reply &&
                    d.reply.senderId ===
                    userId
                ) ||
                mentionMe
            ) {

                replySound.currentTime =
                    0;

                replySound.play()
                    .catch(() => {});

            } else {

                messageSound.currentTime =
                    0;

                messageSound.play()
                    .catch(() => {});
            }
        }


        delete typingUsers[
            d.id
        ];

        renderTyping();


        /* -----------------------------------------
           UPDATE USER
        ----------------------------------------- */

        users[d.id] = {

            name:
                d.sender,

            lastSeen:
                Date.now()
        };


        renderUsers();


        /* -----------------------------------------
           MESSAGE ROW
        ----------------------------------------- */

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "message-row";


        if (
            d.reply &&
            d.reply.senderId ===
            userId
        ) {

            row.classList.add(
                "reply-highlight"
            );
        }


        if (
            d.id !== userId &&
            mentionMe
        ) {

            row.classList.add(
                "mention-highlight"
            );
        }


        /* -----------------------------------------
           REPLY PREVIEW
        ----------------------------------------- */

        if (
            d.reply
        ) {

            const reply =
                document.createElement(
                    "div"
                );


            reply.className =
                "reply-box";


            reply.textContent =
                `↳ ${d.reply.user}: ${d.reply.text}`;


            row.appendChild(
                reply
            );
        }


        /* -----------------------------------------
           USER
        ----------------------------------------- */

        const header =
            document.createElement(
                "span"
            );


        header.className =
            "message-user";


        if (
            d.sender ===
            currentAlias
        ) {

            header.classList.add(
                "self"
            );
        }


        header.textContent =
            d.sender;


        header.onclick =
            () => {

                chatInput.value +=
                    " @" +
                    d.sender;

                chatInput.focus();
            };


        /* -----------------------------------------
           TIME
        ----------------------------------------- */

        const time =
            document.createElement(
                "span"
            );


        time.className =
            "message-time";


        time.textContent =
            ` [${d.timestamp || getChatTime()}] `;


        /* -----------------------------------------
           CONTENT
        ----------------------------------------- */

        const content =
            document.createElement(
                "span"
            );


        content.className =
            "message-text";


        if (
            d.mediaType ===
            "image"
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "chat-image";


            image.src =
                d.text;


            image.alt =
                "Shared image";


            image.loading =
                "lazy";


            image.onerror =
                () => {

                    image.alt =
                        "Image failed to load";

                    image.title =
                        "Image failed to load";
                };


            content.appendChild(
                image
            );

        } else {

            content.textContent =
                " " + d.text;
        }


        /* -----------------------------------------
           REPLY BUTTON
        ----------------------------------------- */

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "msg-btn";


        button.textContent =
            "Reply";


        button.onclick =
            () => {

                replyTarget = {

                    id:
                        d.msgId,

                    senderId:
                        d.id,

                    user:
                        d.sender,

                    text:
                        d.text
                };


                sys(
                    "Replying to " +
                    d.sender
                );


                chatInput.focus();
            };


        /* -----------------------------------------
           APPEND
        ----------------------------------------- */

        row.appendChild(
            header
        );

        row.appendChild(
            time
        );

        row.appendChild(
            content
        );

        row.appendChild(
            button
        );


        chatLog.appendChild(
            row
        );


        chatLog.scrollTop =
            chatLog.scrollHeight;
    }
);


/* =========================================================
   SEND MESSAGE
========================================================= */

function send() {

    const text =
        chatInput.value.trim();


    if (!text) {
        return;
    }

    /* -----------------------------------------
       STOP TYPING
    ----------------------------------------- */

    stopTyping();


    /* -----------------------------------------
       CLEAR COMMAND
    ----------------------------------------- */

    if (
        text ===
        "/clear"
    ) {

        chatLog.innerHTML =
            "";

        sys(
            "chat cleared"
        );

        chatInput.value =
            "";

        return;
    }


    /* -----------------------------------------
       TEST MUSIC
    ----------------------------------------- */

    if (
        text ===
        "/testmusic"
    ) {

        if (
            musicEnabled
        ) {

            specialMusicLock =
                false;

            playNextTrack();
        }


        chatInput.value =
            "";

        return;
    }


    /* -----------------------------------------
       NICKNAME
    ----------------------------------------- */

    if (
        text.startsWith(
            "/nick "
        )
    ) {

        const newNick =
            text
                .slice(6)
                .trim();


        if (!newNick) {

            sys(
                "nickname cannot be empty"
            );

            return;
        }


        if (
            newNick.length >
            30
        ) {

            sys(
                "nickname is too long"
            );

            return;
        }


        const oldNick =
            currentAlias;


        currentAlias =
            newNick;


        profileName.textContent =
            currentAlias;


        users[userId] = {

            name:
                currentAlias,

            lastSeen:
                Date.now()
        };


        renderUsers();


        if (
            client.connected
        ) {

            client.publish(
                topic,
                JSON.stringify({

                    type:
                        "nameChange",

                    id:
                        userId,

                    oldName:
                        oldNick,

                    name:
                        currentAlias

                })
            );
        }


        sys(
            "you are now " +
            currentAlias
        );


        applySpecialProfile(
            currentAlias
        );


        chatInput.value =
            "";

        return;
    }


    /* -----------------------------------------
       MUTE
    ----------------------------------------- */

    if (
        text ===
        "/mute"
    ) {

        musicEnabled =
            false;

        bgMusic.pause();

        musicBtn.textContent =
            "Music: Off";

        sys(
            "music muted"
        );

        chatInput.value =
            "";

        return;
    }


    /* -----------------------------------------
       UNMUTE
    ----------------------------------------- */

    if (
        text ===
        "/unmute"
    ) {

        musicEnabled =
            true;

        musicBtn.textContent =
            "Music: On";


        if (
            bgMusic.src
        ) {

            bgMusic.play()
                .catch(() => {});

        } else {

            playNextTrack();
        }


        sys(
            "music unmuted"
        );


        chatInput.value =
            "";

        return;
    }


    /* -----------------------------------------
       MQTT CONNECTION CHECK
    ----------------------------------------- */

    if (
        !client.connected
    ) {

        sys(
            "not connected to chat server"
        );

        return;
    }


    /* -----------------------------------------
       MESSAGE
    ----------------------------------------- */

    const msgId =
        crypto.randomUUID();


    const payload = {

        type:
            "message",

        msgId:
            msgId,

        id:
            userId,

        sender:
            currentAlias,

        text:
            text,

        timestamp:
            getChatTime()
    };


    if (
        replyTarget
    ) {

        payload.reply =
            replyTarget;

        replyTarget =
            null;
    }


    client.publish(
        topic,
        JSON.stringify(
            payload
        )
    );


    chatInput.value =
        "";
}
sendBtn.onclick = send;

/* =========================================================
   IMAGE UPLOAD
========================================================= */

imgBtn.onclick =
    () => {

        imgUpload.click();
    };


imgUpload.onchange =
    async () => {

        const file =
            imgUpload.files[0];


        if (!file) {
            return;
        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            sys(
                "please select an image file"
            );

            imgUpload.value =
                "";

            return;
        }


        if (
            file.size >
            10 * 1024 * 1024
        ) {

            sys(
                "image is too large (10MB max)"
            );

            imgUpload.value =
                "";

            return;
        }


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );


        try {

            sys(
                "Uploading image..."
            );


            const response =
                await fetch(
                    CLOUDINARY_URL,
                    {
                        method:
                            "POST",

                        body:
                            formData
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "Cloudinary upload failed"
                );
            }


            const data =
                await response.json();


            if (
                !data.secure_url
            ) {

                console.error(
                    data
                );

                sys(
                    "image upload failed"
                );

                return;
            }


            if (
                !client.connected
            ) {

                sys(
                    "not connected to chat server"
                );

                return;
            }


            const msgId =
                crypto.randomUUID();


            const payload = {

                type:
                    "message",

                msgId:
                    msgId,

                id:
                    userId,

                sender:
                    currentAlias,

                text:
                    data.secure_url,

                mediaType:
                    "image",

                timestamp:
                    getChatTime()
            };


            if (
                replyTarget
            ) {

                payload.reply =
                    replyTarget;

                replyTarget =
                    null;
            }


            client.publish(
                topic,
                JSON.stringify(
                    payload
                )
            );


            sys(
                "image sent"
            );


        } catch (error) {

            console.error(
                error
            );

            sys(
                "upload error"
            );

        } finally {

            imgUpload.value =
                "";
        }
    };


/* =========================================================
   CLEAR BUTTON
========================================================= */

clearBtn.onclick =
    () => {

        chatLog.innerHTML =
            "";

        sys(
            "chat cleared"
        );
    };


/* =========================================================
   NICKNAME BUTTON
========================================================= */

nickBtn.onclick =
    () => {

        const newNick =
            prompt(
                "Enter your new screen name:",
                currentAlias
            );


        if (
            newNick &&
            newNick.trim()
        ) {

            chatInput.value =
                "/nick " +
                newNick.trim();

            send();
        }
    };


/* =========================================================
   TYPING HELPERS
========================================================= */

function sendTyping() {

    if (
        !client.connected
    ) {
        return;
    }


    const now =
        Date.now();


    if (
        now - lastTypingSent <
        1000
    ) {
        return;
    }


    lastTypingSent =
        now;


    client.publish(
        topic,
        JSON.stringify({

            type:
                "typing",

            id:
                userId,

            sender:
                currentAlias

        })
    );
}


function stopTyping() {

    clearTimeout(
        typingTimer
    );


    if (
        client.connected
    ) {

        client.publish(
            topic,
            JSON.stringify({

                type:
                    "stopTyping",

                id:
                    userId,

                sender:
                    currentAlias

            })
        );
    }
}


/* =========================================================
   TYPING EVENTS
========================================================= */

chatInput.addEventListener(
    "input",
    () => {

        if (
            chatInput.value.trim()
        ) {

            sendTyping();
        }


        clearTimeout(
            typingTimer
        );


        typingTimer =
            setTimeout(
                stopTyping,
                1200
            );
    }
);


/* =========================================================
   ENTER TO SEND
========================================================= */

chatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            send();
        }
    }
);


/* =========================================================
   INITIAL MUSIC
========================================================= */

refillBag();


/* =========================================================
   INITIAL MESSAGES
========================================================= */

sys(
    "Welcome to luke's chatroom."
);

sys(
    "Instant messaging service initialized."
);


/* =========================================================
   START MUSIC AFTER FIRST USER INTERACTION
========================================================= */

document.addEventListener(
    "click",
    () => {

        if (
            musicStarted ||
            !musicEnabled
        ) {
            return;
        }


        musicStarted =
            true;


        if (
            !specialMusicLock
        ) {

            playNextTrack();
        }

    },
    {
        once: true
    }
);

</script>
